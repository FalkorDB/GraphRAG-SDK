services:
  falkordb:
    # Same as the C engine version CI pins (.github/scripts/falkordb_versions.py).
    # 4.18 under-returns vector search after any write to an indexed node.
    image: falkordb/falkordb:v4.22.2
    ports:
      - "6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  falkordb_data:
