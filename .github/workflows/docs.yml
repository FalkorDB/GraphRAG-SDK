name: Docs

# Mintlify deploys docs/ automatically from the default branch via its GitHub
# app, so CI only validates that every page compiles and every link resolves.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "scripts/check_mdx.mjs"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "scripts/check_mdx.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Check MDX syntax
        run: |
          npm install --no-save @mdx-js/mdx@3.1.1 remark-frontmatter@5.0.0 remark-gfm@4.0.1
          node scripts/check_mdx.mjs

      - name: Check internal links
        working-directory: docs
        run: |
          npm install -g mint@4.2.804
          mint broken-links
