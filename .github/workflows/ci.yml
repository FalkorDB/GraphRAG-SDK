name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    # Weekly, so a new FalkorDB release is tested even when no PR is open.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphrag_sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff check (src)
        run: ruff check src/
      - name: Ruff format check (src)
        run: ruff format --check src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: graphrag_sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Run tests with coverage (3.12 only)
        if: matrix.python-version == '3.12'
        run: python -m pytest tests/ --cov=src/graphrag_sdk --cov-report=term-missing -q

  falkordb-versions:
    name: Resolve FalkorDB versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: C (4.x) and Rust (6.x) engine versions
        id: resolve
        # Pushes and pull requests test the pinned versions, so a FalkorDB
        # release cannot turn CI red for code that did not change. The weekly
        # run tests the newest releases instead, as an early warning.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            python3 .github/scripts/falkordb_versions.py --newest >> "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/falkordb_versions.py >> "$GITHUB_OUTPUT"
          fi

  integration:
    # Named by engine only: a name with the version in it changes with every
    # bump, so it could never be a required check.
    name: Integration (FalkorDB ${{ matrix.engine }})
    needs: falkordb-versions
    runs-on: ubuntu-latest
    # A full run takes a few minutes; a hung server must not hold a runner
    # for the 6-hour default.
    timeout-minutes: 20
    strategy:
      # Both engines run to the end: a failure on one says nothing about the
      # other, and the point is to see each engine's result.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.falkordb-versions.outputs.matrix) }}
    services:
      falkordb:
        image: falkordb/falkordb:${{ matrix.version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: graphrag_sdk
    env:
      RUN_INTEGRATION: "1"
      FALKOR_HOST: localhost
      FALKOR_PORT: "6379"
      # The tests refuse port 6379 unless asked; here it is the throwaway
      # service container above.
      FALKOR_TEST_ALLOW_6379: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Wait for FalkorDB
        # The service container is healthchecked above, but give the
        # graph layer an extra moment to be reachable from Python.
        # The loop MUST fail the step if readiness never arrives —
        # otherwise pytest runs against a dead service and surfaces
        # a much less obvious error.
        run: |
          for _ in $(seq 1 20); do
            if python -c "import redis; redis.Redis(host='localhost', port=6379).ping()"; then
              exit 0
            fi
            sleep 1
          done
          echo "FalkorDB did not become reachable within 20 attempts" >&2
          exit 1
      - name: Check the server is the engine under test
        # A matrix entry that silently ran against another image would report
        # the wrong engine as passing.
        env:
          EXPECTED: ${{ matrix.version }}
        run: |
          python - <<'PY'
          import os, re, redis
          major, minor, patch = map(int, re.match(r"v?(\d+)\.(\d+)\.(\d+)", os.environ["EXPECTED"]).groups())
          modules = redis.Redis(host="localhost", port=6379).module_list()
          graph = next(m for m in modules if m[b"name"] == b"graph")
          running = int(graph[b"ver"])
          expected = major * 10000 + minor * 100 + patch
          print(f"FalkorDB graph module {running}, expected {expected}")
          assert running == expected, f"running {running}, expected {expected}"
          PY
      - name: Run real-FalkorDB integration tests
        # The whole suite, not one file: every test gated on RUN_INTEGRATION
        # (the structured-ingestion, backfill, cached-extraction and
        # ontology-evolution suites) runs here against the live service. The
        # unit job skips them, so this is the only place they run at all.
        run: python -m pytest tests/ -q
